<script>
  var PALETA_CATEGORICA = [
    '#3b82f6', '#22c55e', '#f97316', '#a78bfa', '#f472b6', '#eab308', '#14b8a6', '#f87171',
    '#60a5fa', '#4ade80', '#fb923c', '#c084fc', '#facc15', '#2dd4bf', '#fca5a5', '#93c5fd',
    '#86efac', '#fdba74',
  ];

  var SECOES = {
    dashboard: {
      titulo: 'Dashboard',
      filtros: ['periodo'],
      carregar: function () {
        carregarDashboard(document.getElementById('filtro-periodo').value);
      },
    },
    rankings: { titulo: 'Rankings & Kits', filtros: ['tipovenda'], carregar: carregarRankings },
    producao: { titulo: 'Produção', filtros: [], carregar: carregarProducao },
    marketplace: { titulo: 'Marketplace', filtros: ['periodo', 'marketplace'], carregar: carregarMarketplace },
    categorias: { titulo: 'Categorias', filtros: ['periodo', 'categoria'], carregar: carregarCategorias },
    calendario: { titulo: 'Calendário & Sazonalidade', filtros: [], carregar: carregarCalendario },
    alertas: { titulo: 'Alertas Inteligentes', filtros: [], carregar: carregarAlertas },
    inventario: { titulo: 'Inventário Rápido', filtros: [], carregar: carregarInventario },
    etiquetas: { titulo: 'Etiquetas', filtros: ['periodo', 'etiqueta'], carregar: carregarEtiquetas },
    eventos: { titulo: 'Eventos', filtros: ['eventotipo', 'eventomes'], carregar: carregarEventos },
    detalhamento: { titulo: 'Detalhamento', filtros: [], carregar: carregarDetalhamento_ },
  };

  var secaoAtual = 'dashboard';
  var state = {};
  var carregado = {};

  // ---------- infraestrutura ----------

  function runServer(nomeFuncao) {
    var args = Array.prototype.slice.call(arguments, 1);
    return new Promise(function (resolve, reject) {
      var chamada = google.script.run.withSuccessHandler(resolve).withFailureHandler(reject);
      chamada[nomeFuncao].apply(chamada, args);
    });
  }

  function fmt_(v) {
    if (v === null || v === undefined || v === '') return '—';
    return typeof v === 'number' ? v.toLocaleString('pt-BR') : String(v);
  }

  function escapeAttr_(s) {
    return String(s).replace(/"/g, '&quot;');
  }

  function parseDataISO_(iso) {
    var partes = iso.split('-');
    return new Date(Number(partes[0]), Number(partes[1]) - 1, Number(partes[2]));
  }

  function mostrarErro_(erro) {
    console.error(erro);
    var msg = erro && erro.message ? erro.message : String(erro);
    var secaoEl = document.getElementById('section-' + secaoAtual);
    var aviso = document.createElement('div');
    aviso.className = 'empty-state';
    aviso.style.color = '#fca5a5';
    aviso.textContent = 'Erro ao carregar: ' + msg;
    secaoEl.insertBefore(aviso, secaoEl.firstChild);
  }

  function chartOptionsBase_(extra) {
    var base = {
      backgroundColor: 'transparent',
      titleTextStyle: { color: '#e6ecff' },
      legendTextStyle: { color: '#93a2c7' },
      hAxis: { textStyle: { color: '#93a2c7' }, gridlines: { color: '#263353' } },
      vAxis: { textStyle: { color: '#93a2c7' }, gridlines: { color: '#263353' } },
      chartArea: { left: 60, right: 20, top: 20, bottom: 50, width: '100%', height: '100%' },
    };
    for (var chave in extra) base[chave] = extra[chave];
    return base;
  }

  function renderArrayTable(elId, headers, rows) {
    var el = document.getElementById(elId);
    if (!rows || rows.length === 0) {
      el.innerHTML = '<tr><td class="empty-state">Sem dados ainda.</td></tr>';
      return;
    }
    var html = '<thead><tr>' + headers.map(function (h) { return '<th>' + h + '</th>'; }).join('') + '</tr></thead><tbody>';
    rows.forEach(function (row) {
      html += '<tr>' + row.map(function (v) { return '<td>' + fmt_(v) + '</td>'; }).join('') + '</tr>';
    });
    html += '</tbody>';
    el.innerHTML = html;
  }

  // ---------- navegação ----------

  // Sidebar mobile (menu hambúrguer): controla a classe que faz a sidebar
  // deslizar por cima do conteúdo em telas pequenas (ver media query em
  // Stylesheet.html). Em telas largas essa classe não tem efeito nenhum
  // (a sidebar já é fixa no layout), então é seguro chamar sempre.
  function alternarSidebar_(forcarFechar) {
    var app = document.getElementById('app');
    if (forcarFechar === true) app.classList.remove('sidebar-aberta');
    else if (forcarFechar === false) app.classList.add('sidebar-aberta');
    else app.classList.toggle('sidebar-aberta');
  }

  function ativarSecao_(nome) {
    secaoAtual = nome;
    alternarSidebar_(true);
    document.querySelectorAll('.nav-item').forEach(function (el) {
      el.classList.toggle('active', el.dataset.section === nome);
    });
    document.querySelectorAll('.section').forEach(function (el) {
      el.classList.toggle('active', el.id === 'section-' + nome);
    });
    document.getElementById('topbar-title').textContent = SECOES[nome].titulo;

    ['periodo', 'marketplace', 'categoria', 'tipovenda', 'etiqueta', 'eventotipo', 'eventomes'].forEach(function (f) {
      document.getElementById('filtro-' + f + '-wrap').style.display =
        SECOES[nome].filtros.indexOf(f) !== -1 ? 'inline-block' : 'none';
    });

    if (!carregado[nome]) {
      carregado[nome] = true;
      SECOES[nome].carregar();
    }
  }

  // ---------- Dashboard ----------

  function carregarDashboard(periodo) {
    document.getElementById('kpi-grid').innerHTML = '<div class="loading">Carregando KPIs…</div>';
    runServer('apiObterKPIs', periodo)
      .then(function (kpis) {
        renderKpiCards_(kpis);
        renderChartTopProdutos_(kpis.rankingProdutos);
        renderChartPorMarketplace_(kpis.rankingLojas);
        renderChartKitIndividual_(kpis.kits, kpis.individuais);
        renderGaugeRisco_(kpis.produtosEmRiscoDeRuptura, kpis.produtosAtivos + kpis.produtosSemVenda);
      })
      .catch(mostrarErro_);
  }

  function renderKpiCards_(k) {
    var cards = [
      { label: 'Pedidos no período', value: k.pedidosNoPeriodo, accent: 'var(--blue)' },
      { label: 'Itens vendidos', value: k.itensVendidos, accent: 'var(--blue)' },
      { label: 'Produtos ativos / sem venda', value: k.produtosAtivos + ' / ' + k.produtosSemVenda, accent: 'var(--green)' },
      { label: 'Estoque total', value: k.estoqueTotal, accent: 'var(--green)' },
      { label: 'Produtos em risco de ruptura', value: k.produtosEmRiscoDeRuptura, accent: 'var(--orange)' },
      { label: 'Kits vs. individuais', value: k.kits + ' / ' + k.individuais, accent: 'var(--blue)' },
      { label: 'Produto campeão', value: k.produtoCampeao, accent: 'var(--green)' },
      { label: 'Marketplace campeão', value: k.marketplaceCampeao, accent: 'var(--orange)' },
    ];
    document.getElementById('kpi-grid').innerHTML = cards
      .map(function (c) {
        return (
          '<div class="kpi-card" style="--accent:' + c.accent + '"><div class="label">' + c.label +
          '</div><div class="value">' + fmt_(c.value) + '</div></div>'
        );
      })
      .join('');
  }

  function renderChartTopProdutos_(rankingProdutos) {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Produto');
    data.addColumn('number', 'Quantidade');
    data.addRows(rankingProdutos.length ? rankingProdutos : [['Sem dados', 0]]);
    var chart = new google.visualization.ColumnChart(document.getElementById('chart-top-produtos'));
    chart.draw(data, chartOptionsBase_({ colors: ['#3b82f6'], legend: { position: 'none' } }));
  }

  function renderChartPorMarketplace_(rankingLojas) {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Loja');
    data.addColumn('number', 'Quantidade');
    data.addRows(rankingLojas.length ? rankingLojas : [['Sem dados', 1]]);
    var chart = new google.visualization.PieChart(document.getElementById('chart-por-marketplace'));
    chart.draw(data, chartOptionsBase_({ colors: PALETA_CATEGORICA, legend: { position: 'right', textStyle: { color: '#93a2c7' } } }));
  }

  function renderChartKitIndividual_(kits, individuais) {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Tipo');
    data.addColumn('number', 'Quantidade');
    data.addRows([['Kits', kits], ['Individuais', individuais]]);
    var chart = new google.visualization.PieChart(document.getElementById('chart-kit-individual'));
    chart.draw(
      data,
      chartOptionsBase_({ colors: ['#3b82f6', '#22c55e'], pieHole: 0.4, legend: { position: 'right', textStyle: { color: '#93a2c7' } } })
    );
  }

  function renderGaugeRisco_(qtdRisco, totalCatalogo) {
    var max = Math.max(totalCatalogo, qtdRisco, 1);
    var data = google.visualization.arrayToDataTable([
      ['Label', 'Value'],
      ['Em risco', qtdRisco],
    ]);
    var chart = new google.visualization.Gauge(document.getElementById('chart-gauge-risco'));
    chart.draw(data, {
      max: max,
      min: 0,
      redFrom: Math.round(max * 0.66),
      redTo: max,
      yellowFrom: Math.round(max * 0.33),
      yellowTo: Math.round(max * 0.66),
      greenFrom: 0,
      greenTo: Math.round(max * 0.33),
      minorTicks: 5,
      backgroundColor: 'transparent',
    });
  }

  // ---------- Rankings ----------

  function carregarRankings() {
    runServer('apiObterRankings')
      .then(function (dados) {
        state.rankings = dados;
        renderTabelaTop15ProducaoRankings_(dados.top15Producao);
        renderArrayTable('tabela-top-produtos', ['Produto', 'Quantidade'], dados.topProdutos);
        renderArrayTable('tabela-ranking-kits', ['Kit', 'Quantidade'], dados.rankingKits);
        renderArrayTable('tabela-crescimento', ['Período', 'Atual', 'Anterior', 'Variação'], dados.crescimentoPeriodos);
        renderChartSemanasMes_(dados.semanasDoMes);
        aplicarFiltroTipoVenda_();
        renderArrayTable('tabela-top-participacao-kits', ['Produto', 'Quantidade em Kits'], dados.topParticipacaoEmKits);
        renderArrayTable('tabela-extremos-kits', ['Destaque', 'Kit', 'Quantidade'], dados.extremosDeKits);
      })
      .catch(mostrarErro_);
  }

  function renderTabelaTop15ProducaoRankings_(linhas) {
    var el = document.getElementById('tabela-top15-producao-rankings');
    if (!linhas.length) {
      el.innerHTML = '<tr><td class="empty-state">Sem dados — nenhum produto/kit com venda no mês passado.</td></tr>';
      return;
    }
    var html =
      '<thead><tr><th>Produto/Kit</th><th>Tipo</th><th>Vendido Mês Passado</th><th>Vendido Este Mês</th></tr></thead><tbody>';
    linhas.forEach(function (l, indice) {
      html +=
        '<tr class="linha-clicavel" data-indice="' + indice + '">' +
        '<td>' + fmt_(l.produto) + '</td>' +
        '<td>' + l.tipo + '</td>' +
        '<td>' + fmt_(l.vendidoMesPassado) + '</td>' +
        '<td>' + fmt_(l.vendidoMesAtual) + '</td>' +
        '</tr>';
    });
    html += '</tbody>';
    el.innerHTML = html;

    el.querySelectorAll('.linha-clicavel').forEach(function (tr) {
      tr.addEventListener('click', function () {
        abrirModalMarketplace_(linhas[Number(tr.dataset.indice)]);
      });
    });
  }

  function abrirModalMarketplace_(linha) {
    var dados = state.rankings;
    var porMarketplace = (dados && dados.top15ProducaoPorMarketplace && dados.top15ProducaoPorMarketplace[linha.chave]) || [];

    document.getElementById('modal-marketplace-titulo').textContent = linha.produto + ' — vendas por marketplace';

    var el = document.getElementById('tabela-modal-marketplace');
    if (!porMarketplace.length) {
      el.innerHTML = '<tr><td class="empty-state">Sem vendas registradas por marketplace pra esse item.</td></tr>';
    } else {
      var html =
        '<thead><tr><th>Marketplace</th><th>Vendido Mês Passado</th><th>Vendido Este Mês</th><th>Títulos Encontrados</th></tr></thead><tbody>';
      porMarketplace.forEach(function (m) {
        var titulos = m.titulos && m.titulos.length ? m.titulos.join('<br>') : '—';
        html +=
          '<tr><td>' + fmt_(m.loja) + '</td><td>' + fmt_(m.vendidoMesPassado) + '</td><td>' + fmt_(m.vendidoMesAtual) + '</td>' +
          '<td>' + titulos + '</td></tr>';
      });
      html += '</tbody>';
      el.innerHTML = html;
    }

    document.getElementById('modal-marketplace-backdrop').style.display = 'flex';
  }

  function fecharModalMarketplace_() {
    document.getElementById('modal-marketplace-backdrop').style.display = 'none';
  }

  function renderChartSemanasMes_(semanasDoMes) {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Semana');
    data.addColumn('number', 'Quantidade');
    data.addRows(semanasDoMes.length ? semanasDoMes : [['Sem dados', 0]]);
    var chart = new google.visualization.ColumnChart(document.getElementById('chart-semanas-mes'));
    chart.draw(data, chartOptionsBase_({ colors: ['#a78bfa'], legend: { position: 'none' } }));
  }

  function aplicarFiltroTipoVenda_() {
    var dados = state.rankings;
    if (!dados) return;
    renderArrayTable(
      'tabela-kit-vs-individual',
      ['Produto', 'Vendido em Kit', 'Vendido Individual', 'Predominância'],
      dados.kitVsIndividualPorProduto
    );
    var filtro = document.getElementById('filtro-tipovenda').value;
    var mapa = { kit: 'Só Kit', individual: 'Só Individual', ambos: 'Ambos' };
    var linhas = filtro
      ? dados.classificacaoKitIndividual.filter(function (l) { return l[1] === mapa[filtro]; })
      : dados.classificacaoKitIndividual;
    renderArrayTable('tabela-classificacao-kit', ['Produto', 'Classificação'], linhas);
  }

  // ---------- Produção ----------

  var selecaoEtiquetasProducao = new Set();

  function carregarProducao() {
    runServer('apiObterProducao')
      .then(function (linhas) {
        selecaoEtiquetasProducao.clear();
        renderTabelaProducao_(linhas);
      })
      .catch(mostrarErro_);

    document.getElementById('producao-etiquetas-status').style.display = 'none';
    document.getElementById('producao-solicitacao-status').style.display = 'none';

    runServer('apiObterEmailsSalvos')
      .then(function (lista) {
        state.emailsSalvosProducao = lista;
        state.emailsSalvosSelecionadosProducao = new Set();
        renderEmailsSalvosProducao_(lista);
      })
      .catch(mostrarErro_);
  }

  function chaveProducao_(linha) {
    return linha.tipo + '||' + linha.produto;
  }

  function renderTabelaProducao_(linhas) {
    var el = document.getElementById('tabela-producao');
    state.producao = linhas;
    atualizarContagemEtiquetasProducao_();

    if (!linhas.length) {
      el.innerHTML = '<tr><td class="empty-state">Sem dados — nenhum produto/kit com venda no mês passado.</td></tr>';
      return;
    }

    var html =
      '<thead><tr><th><input type="checkbox" id="producao-marcar-todos"></th><th>Produto/Kit</th><th>Tipo</th>' +
      '<th>Vendido Mês Passado</th><th>Vendido Este Mês</th><th>Meta do Mês</th><th>Estoque Atual</th>' +
      '<th>Código da Caixa</th><th>Sugestão de Produção</th><th></th></tr></thead><tbody>';
    linhas.forEach(function (l, indice) {
      var chave = chaveProducao_(l);
      html +=
        '<tr>' +
        '<td><input type="checkbox" class="chk-producao-etiqueta" data-indice="' + indice + '"' +
        (selecaoEtiquetasProducao.has(chave) ? ' checked' : '') +
        '></td>' +
        '<td>' + fmt_(l.produto) + '</td>' +
        '<td>' + l.tipo + '</td>' +
        '<td>' + fmt_(l.vendidoMesPassado) + '</td>' +
        '<td>' + fmt_(l.vendidoMesAtual) + '</td>' +
        '<td>' + fmt_(l.meta) + '</td>' +
        '<td><input type="number" min="0" class="input-numero-producao" data-indice="' + indice + '" value="' + l.estoqueAtual + '"></td>' +
        '<td><input type="text" class="input-codigo-producao" data-indice="' + indice + '" value="' + escapeAttr_(l.codigo || '') + '" placeholder="ex.: PO100DARK30"></td>' +
        '<td>' + fmt_(l.sugestaoProducao) + '</td>' +
        '<td><button type="button" class="btn-salvar-estoque-producao" data-indice="' + indice + '" title="Salvar estoque e código">💾</button></td>' +
        '</tr>';
    });
    html += '</tbody>';
    el.innerHTML = html;

    el.querySelectorAll('.btn-salvar-estoque-producao').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var indice = Number(btn.dataset.indice);
        var linha = state.producao[indice];
        var inputQtd = el.querySelector('.input-numero-producao[data-indice="' + indice + '"]');
        var inputCodigo = el.querySelector('.input-codigo-producao[data-indice="' + indice + '"]');
        var quantidade = Number(inputQtd.value) || 0;
        var codigo = inputCodigo.value.trim();

        btn.disabled = true;
        runServer('apiDefinirEstoqueProducao', linha.produto, linha.tipo, quantidade, codigo)
          .then(function (novaLista) {
            renderTabelaProducao_(novaLista);
          })
          .catch(mostrarErro_)
          .finally(function () {
            btn.disabled = false;
          });
      });
    });

    el.querySelectorAll('.chk-producao-etiqueta').forEach(function (chk) {
      chk.addEventListener('change', function () {
        var indice = Number(chk.dataset.indice);
        var chave = chaveProducao_(state.producao[indice]);
        if (chk.checked) selecaoEtiquetasProducao.add(chave);
        else selecaoEtiquetasProducao.delete(chave);
        atualizarContagemEtiquetasProducao_();
      });
    });

    var chkTodos = document.getElementById('producao-marcar-todos');
    var todosMarcados = linhas.every(function (l) { return selecaoEtiquetasProducao.has(chaveProducao_(l)); });
    var algumMarcado = linhas.some(function (l) { return selecaoEtiquetasProducao.has(chaveProducao_(l)); });
    chkTodos.checked = todosMarcados;
    chkTodos.indeterminate = !todosMarcados && algumMarcado;
    chkTodos.addEventListener('change', function () {
      linhas.forEach(function (l) {
        var chave = chaveProducao_(l);
        if (chkTodos.checked) selecaoEtiquetasProducao.add(chave);
        else selecaoEtiquetasProducao.delete(chave);
      });
      renderTabelaProducao_(linhas);
    });
  }

  function atualizarContagemEtiquetasProducao_() {
    var n = selecaoEtiquetasProducao.size;
    var contagemEl = document.getElementById('producao-etiquetas-contagem');
    if (contagemEl) contagemEl.textContent = n + (n === 1 ? ' selecionado' : ' selecionados');
  }

  function mostrarStatusProducao_(mensagem, erro) {
    var statusEl = document.getElementById('producao-etiquetas-status');
    statusEl.style.display = 'block';
    statusEl.style.color = erro ? '#fca5a5' : '#86efac';
    statusEl.textContent = mensagem;
  }

  function gerarEtiquetasProducao_() {
    var linhas = state.producao || [];
    var itens = linhas.filter(function (l) { return selecaoEtiquetasProducao.has(chaveProducao_(l)); });

    if (itens.length === 0) {
      mostrarStatusProducao_('Selecione ao menos um produto/kit para gerar etiquetas.', true);
      return;
    }

    abrirModalSelecaoEtiquetas_(itens);
  }

  var itensSelecaoEtiquetas = [];

  function abrirModalSelecaoEtiquetas_(itens) {
    itensSelecaoEtiquetas = itens;
    var el = document.getElementById('lista-selecao-etiquetas');
    el.innerHTML = itens
      .map(function (item, indice) {
        return (
          '<div class="linha-selecao-etiqueta">' +
          '<div class="linha-selecao-etiqueta-nome">' + fmt_(item.produto) + '</div>' +
          '<label class="checkbox-linha"><input type="checkbox" class="chk-incluir-caixa" data-indice="' + indice + '" checked> Caixa</label>' +
          '<label class="checkbox-linha"><input type="checkbox" class="chk-incluir-individual" data-indice="' + indice + '" checked> Individual</label>' +
          '</div>'
        );
      })
      .join('');

    document.getElementById('selecao-etiquetas-status').style.display = 'none';
    document.getElementById('modal-etiquetas-selecao-backdrop').style.display = 'flex';
  }

  function fecharModalSelecaoEtiquetas_() {
    document.getElementById('modal-etiquetas-selecao-backdrop').style.display = 'none';
  }

  function confirmarSelecaoEtiquetas_() {
    var el = document.getElementById('lista-selecao-etiquetas');
    var itensComEscolha = itensSelecaoEtiquetas.map(function (item, indice) {
      var chkCaixa = el.querySelector('.chk-incluir-caixa[data-indice="' + indice + '"]');
      var chkIndividual = el.querySelector('.chk-incluir-individual[data-indice="' + indice + '"]');
      var copia = {};
      for (var chave in item) copia[chave] = item[chave];
      copia.incluirCaixa = chkCaixa.checked;
      copia.incluirIndividual = chkIndividual.checked;
      return copia;
    });

    var botao = document.getElementById('btn-confirmar-selecao-etiquetas');
    botao.disabled = true;
    var statusEl = document.getElementById('selecao-etiquetas-status');
    statusEl.style.display = 'block';
    statusEl.style.color = '#86efac';
    statusEl.textContent = 'Gerando PDF e enviando por e-mail...';

    runServer('apiGerarEtiquetasProducaoPdf', itensComEscolha)
      .then(function () {
        fecharModalSelecaoEtiquetas_();
        mostrarStatusProducao_('✅ PDF enviado para victor@gigaimports.com (' + itensComEscolha.length + ' produto(s)/kit(s)).', false);
      })
      .catch(function (erro) {
        statusEl.style.color = '#fca5a5';
        statusEl.textContent = 'Erro ao gerar etiquetas: ' + (erro && erro.message ? erro.message : erro);
      })
      .finally(function () {
        botao.disabled = false;
      });
  }

  // ---------- Produção: solicitar produção por e-mail ----------
  // Usa a MESMA lista de e-mails salvos da aba Etiquetas (apiObterEmailsSalvos
  // / apiSalvarEmail / apiRemoverEmailSalvo) — só a renderização/seleção no
  // cliente é própria dessa tela (state.emailsSalvosProducao/
  // emailsSalvosSelecionadosProducao), pra não interferir com a seleção que
  // já está aberta na aba Etiquetas.

  function renderEmailsSalvosProducao_(lista) {
    var wrap = document.getElementById('producao-emails-salvos-wrap');
    var el = document.getElementById('producao-emails-salvos-lista');

    if (!lista || !lista.length) {
      wrap.style.display = 'none';
      el.innerHTML = '';
      return;
    }
    wrap.style.display = 'block';

    if (!state.emailsSalvosSelecionadosProducao) state.emailsSalvosSelecionadosProducao = new Set();
    var selecionados = state.emailsSalvosSelecionadosProducao;

    el.innerHTML = lista
      .map(function (email) {
        return (
          '<span class="email-salvo-chip">' +
          '<label class="checkbox-linha"><input type="checkbox" class="chk-email-salvo-producao" data-email="' +
          escapeAttr_(email) +
          '"' +
          (selecionados.has(email) ? ' checked' : '') +
          '> ' +
          email +
          '</label>' +
          '<button type="button" class="btn-remover-email" data-email="' + escapeAttr_(email) + '" title="Remover">✕</button>' +
          '</span>'
        );
      })
      .join('');

    el.querySelectorAll('.chk-email-salvo-producao').forEach(function (chk) {
      chk.addEventListener('change', function () {
        if (chk.checked) selecionados.add(chk.dataset.email);
        else selecionados.delete(chk.dataset.email);
      });
    });

    el.querySelectorAll('.btn-remover-email').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var email = btn.dataset.email;
        runServer('apiRemoverEmailSalvo', email)
          .then(function (novaLista) {
            state.emailsSalvosProducao = novaLista;
            selecionados.delete(email);
            renderEmailsSalvosProducao_(novaLista);
          })
          .catch(function (erro) {
            mostrarStatusSolicitacaoProducao_('Erro ao remover e-mail: ' + (erro && erro.message ? erro.message : erro), true);
          });
      });
    });
  }

  function salvarEmailAtualProducao_() {
    var email = document.getElementById('producao-solicitacao-destinatario').value.trim();
    if (!email) {
      mostrarStatusSolicitacaoProducao_('Digite um e-mail antes de salvar.', true);
      return;

  function solicitarProducaoPorEmail_() {
    var linhas = state.producao || [];
    var itens = linhas.filter(function (l) { return selecaoEtiquetasProducao.has(chaveProducao_(l)); });

    if (itens.length === 0) {
      mostrarStatusSolicitacaoProducao_('Selecione ao menos um produto/kit para solicitar produção.', true);
      return;
    }

    var destinatarioDigitado = document.getElementById('producao-solicitacao-destinatario').value.trim();
    var destinatarios = [];
    if (destinatarioDigitado) destinatarios.push(destinatarioDigitado);
    (state.emailsSalvosSelecionadosProducao || new Set()).forEach(function (email) {
      if (destinatarios.indexOf(email) === -1) destinatarios.push(email);
    });

    if (destinatarios.length === 0) {
      mostrarStatusSolicitacaoProducao_('Digite ou marque ao menos um e-mail de destinatário.', true);
      return;
    }

    var botao = document.getElementById('btn-solicitar-producao');
    botao.disabled = true;
    mostrarStatusSolicitacaoProducao_('Enviando...', false);

    runServer('apiEnviarSolicitacaoProducao', destinatarios, itens)
      .then(function () {
        mostrarStatusSolicitacaoProducao_('✅ Solicitação enviada para ' + destinatarios.join(', ') + '.', false);
      })
      .catch(function (erro) {
        mostrarStatusSolicitacaoProducao_('Erro ao enviar: ' + (erro && erro.message ? erro.message : erro), true);
      })
      .finally(function () {
        botao.disabled = false;
      });
  }

  // ---------- Etiquetas ----------

  var selecaoEmailEtiquetas = new Set();

  var COLUNAS_ETIQUETAS_QUANTIDADE = [
    { chave: 'produto', rotulo: 'Produto' },
    { chave: 'total', rotulo: 'Total' },
    { chave: 'individual', rotulo: 'Individual' },
    { chave: 'kit', rotulo: 'Kit' },
  ];

  // Estado de ordenação persiste entre trocas de período/busca — cada
  // tabela guarda sua própria coluna/direção atual, mantida até o usuário
  // clicar em outro cabeçalho.
  var ordenacaoEtiquetas = {
    com: { coluna: 'produto', direcao: 'asc' },
    sem: { coluna: 'produto', direcao: 'asc' },
    semCorrespondencia: { coluna: 'titulo', direcao: 'asc' },
  };

  function carregarEtiquetas() {
    var periodo = document.getElementById('filtro-periodo').value;
    runServer('apiObterEtiquetas', periodo)
      .then(function (dados) {
        state.etiquetas = dados;

        document.getElementById('etiquetas-status').style.display = 'none';
        aplicarFiltroEtiqueta_();

      .catch(mostrarErro_);

    runServer('apiObterEmailsSalvos')

        state.emailsSalvosSelecionados = new Set();
        renderEmailsSalvos_(lista);
      })
      .catch(mostrarErro_);

  function normalizarBuscaEtiquetas_(texto) {
    return String(texto || '')
      .toLowerCase()
      .normalize('NFD')
      .replace(/[̀-ͯ]/g, '')
      .trim();
  }

  // "patchouli + 100ml" -> ['patchouli', '100ml'], cada termo já
  // normalizado. Sem limite de termos combinados; termos vazios (ex.: "+"
  // sobrando no fim) são descartados.
  function extrairTermosBusca_(texto) {
    return String(texto || '')
      .split('+')
      .map(normalizarBuscaEtiquetas_)
      .filter(function (termo) {
        return termo !== '';
      });
  }

  // Todos os termos precisam bater (E lógico) em algum ponto do texto.
  function textoCorrespondeATermos_(textoAlvo, termos) {
    if (!termos.length) return true;
    var alvoNormalizado = normalizarBuscaEtiquetas_(textoAlvo);
    return termos.every(function (termo) {
      return alvoNormalizado.indexOf(termo) !== -1;
    });
  }

  function ordenarItensEtiquetas_(itens, coluna, direcao) {
    var copia = itens.slice();
    copia.sort(function (a, b) {
      var va = coluna === 'titulo' ? a : a[coluna];
      var vb = coluna === 'titulo' ? b : b[coluna];
      var resultado =
        typeof va === 'number' && typeof vb === 'number' ? va - vb : String(va).localeCompare(String(vb), 'pt-BR');
      return direcao === 'asc' ? resultado : -resultado;
    });
    return copia;
  }

  function construirCabecalhoOrdenavel_(colunas, chaveOrdenacao) {
    var estado = ordenacaoEtiquetas[chaveOrdenacao];
    return colunas
      .map(function (col) {
        var seta = estado.coluna === col.chave ? (estado.direcao === 'asc' ? ' ASC' : ' DESC') : '';
        return (
          '<th class="th-ordenavel" data-tabela="' + chaveOrdenacao + '" data-coluna="' + col.chave + '">' +
          col.rotulo +
          seta +
          '</th>'
        );
      })
      .join('');
  }

  function ordenarClique_(chaveOrdenacao, coluna) {
    var estado = ordenacaoEtiquetas[chaveOrdenacao];
    if (estado.coluna === coluna) {
      estado.direcao = estado.direcao === 'asc' ? 'desc' : 'asc';
    } else {
      estado.coluna = coluna;
      estado.direcao = 'asc';
    }
    aplicarFiltroEtiqueta_();
  }

  function aplicarFiltroEtiqueta_() {
    var dados = state.etiquetas;
    if (!dados) return;
    var filtro = document.getElementById('filtro-etiqueta').value;
    var termos = extrairTermosBusca_(document.getElementById('busca-etiquetas').value);

    var mostrarCom = !filtro || filtro === 'com';
    var mostrarSem = !filtro || filtro === 'sem';
    var mostrarSemCorrespondencia = !filtro || filtro === 'semcorrespondencia';

    document.getElementById('bloco-etiquetas-com').style.display = mostrarCom ? '' : 'none';
    document.getElementById('bloco-etiquetas-sem').style.display = mostrarSem ? '' : 'none';
    document.getElementById('bloco-etiquetas-semcorrespondencia').style.display = mostrarSemCorrespondencia ? '' : 'none';

    var comFiltrado = dados.comEtiqueta.filter(function (i) {
      return textoCorrespondeATermos_(i.produto, termos);
    });
    var semFiltrado = dados.semEtiqueta.filter(function (i) {
      return textoCorrespondeATermos_(i.produto, termos);
    });
    var semCorrespondenciaFiltrado = dados.semCorrespondencia.filter(function (t) {
      return textoCorrespondeATermos_(t, termos);
    });

    state.etiquetasVisivelSem = semFiltrado;

    renderTabelaEtiquetasComQuantidade_('tabela-etiquetas-com', comFiltrado, false, 'com');
    renderTabelaEtiquetasComQuantidade_('tabela-etiquetas-sem', semFiltrado, true, 'sem');
    renderTabelaEtiquetasSemCorrespondencia_('tabela-etiquetas-semcorrespondencia', semCorrespondenciaFiltrado);

    atualizarCheckboxMarcarTodos_(semFiltrado);
  }

  function renderTabelaEtiquetasComQuantidade_(elId, itens, comCheckbox, chaveOrdenacao) {
    var el = document.getElementById(elId);
    var estado = ordenacaoEtiquetas[chaveOrdenacao];
    var ordenados = ordenarItensEtiquetas_(itens, estado.coluna, estado.direcao);

    if (!ordenados.length) {
      el.innerHTML = '<tr><td class="empty-state">Sem dados ainda.</td></tr>';
      return;
    }
    var cabecalho = (comCheckbox ? '<th></th>' : '') + construirCabecalhoOrdenavel_(COLUNAS_ETIQUETAS_QUANTIDADE, chaveOrdenacao);
    var html = '<thead><tr>' + cabecalho + '</tr></thead><tbody>';
    ordenados.forEach(function (i) {
      var checkboxHtml = comCheckbox
        ? '<td><input type="checkbox" class="chk-etiqueta-item" data-produto="' +
          escapeAttr_(i.produto) +
          '"' +
          (selecaoEmailEtiquetas.has(i.produto) ? ' checked' : '') +
          '></td>'
        : '';
      html +=
        '<tr>' +
        checkboxHtml +
        '<td>' + i.produto + '</td>' +
        '<td>' + fmt_(i.total) + '</td>' +
        '<td>' + fmt_(i.individual) + '</td>' +
        '<td>' + fmt_(i.kit) + '</td>' +
        '</tr>';
    });
    html += '</tbody>';
    el.innerHTML = html;

    if (comCheckbox) {
      el.querySelectorAll('.chk-etiqueta-item').forEach(function (chk) {
        chk.addEventListener('change', function () {
          var produto = chk.dataset.produto;
          if (chk.checked) selecaoEmailEtiquetas.add(produto);
          else selecaoEmailEtiquetas.delete(produto);
          atualizarCheckboxMarcarTodos_(state.etiquetasVisivelSem || []);
        });
      });
    }
  }

  function renderTabelaEtiquetasSemCorrespondencia_(elId, titulos) {
    var el = document.getElementById(elId);
    var estado = ordenacaoEtiquetas.semCorrespondencia;
    var ordenados = ordenarItensEtiquetas_(titulos, 'titulo', estado.direcao);

    if (!ordenados.length) {
      el.innerHTML = '<tr><td class="empty-state">Sem dados ainda.</td></tr>';
      return;
    }
    var cabecalho = construirCabecalhoOrdenavel_([{ chave: 'titulo', rotulo: 'Título vendido' }], 'semCorrespondencia');
    var html = '<thead><tr>' + cabecalho + '</tr></thead><tbody>';
    ordenados.forEach(function (t) {
      html += '<tr><td>' + fmt_(t) + '</td></tr>';
    });
    html += '</tbody>';
    el.innerHTML = html;
  }

  function atualizarCheckboxMarcarTodos_(visiveis) {
    var n = selecaoEmailEtiquetas.size;
    document.getElementById('etiquetas-contagem-selecionados').textContent = n + (n === 1 ? ' selecionado' : ' selecionados');

    var chkTodos = document.getElementById('etiquetas-marcar-todos');
    if (!visiveis.length) {
      chkTodos.checked = false;
      chkTodos.indeterminate = false;
      return;
    }
    var todosMarcados = visiveis.every(function (i) { return selecaoEmailEtiquetas.has(i.produto); });
    var algumMarcado = visiveis.some(function (i) { return selecaoEmailEtiquetas.has(i.produto); });
    chkTodos.checked = todosMarcados;
    chkTodos.indeterminate = !todosMarcados && algumMarcado;
  }

  function alternarMarcarTodosEtiquetas_() {
    var visiveis = state.etiquetasVisivelSem || [];
    var chkTodos = document.getElementById('etiquetas-marcar-todos');
    if (chkTodos.checked) {
      visiveis.forEach(function (i) { selecaoEmailEtiquetas.add(i.produto); });
    } else {
      visiveis.forEach(function (i) { selecaoEmailEtiquetas.delete(i.produto); });
    }
    aplicarFiltroEtiqueta_();
  }

  function mostrarStatusEtiquetas_(mensagem, erro) {
    var statusEl = document.getElementById('etiquetas-status');
    statusEl.style.display = 'block';
    statusEl.style.color = erro ? '#fca5a5' : '#86efac';
    statusEl.textContent = mensagem;
  }

  // ---------- E-mails salvos ----------

  function renderEmailsSalvos_(lista) {
    var wrap = document.getElementById('emails-salvos-wrap');
    var el = document.getElementById('emails-salvos-lista');

    if (!lista || !lista.length) {
      wrap.style.display = 'none';
      el.innerHTML = '';
      return;
    }
    wrap.style.display = 'block';

    if (!state.emailsSalvosSelecionados) state.emailsSalvosSelecionados = new Set();
    var selecionados = state.emailsSalvosSelecionados;

    el.innerHTML = lista
      .map(function (email) {
        return (
          '<span class="email-salvo-chip">' +
          '<label class="checkbox-linha"><input type="checkbox" class="chk-email-salvo" data-email="' +
          escapeAttr_(email) +
          '"' +
          (selecionados.has(email) ? ' checked' : '') +
          '> ' +
          email +
          '</label>' +
          '<button type="button" class="btn-remover-email" data-email="' + escapeAttr_(email) + '" title="Remover">✕</button>' +
          '</span>'
        );
      })
      .join('');

    el.querySelectorAll('.chk-email-salvo').forEach(function (chk) {
      chk.addEventListener('change', function () {
        if (chk.checked) selecionados.add(chk.dataset.email);
        else selecionados.delete(chk.dataset.email);
      });
    });

    el.querySelectorAll('.btn-remover-email').forEach(function (btn) {
      btn.addEventListener('click', function () {
        var email = btn.dataset.email;
        runServer('apiRemoverEmailSalvo', email)
          .then(function (novaLista) {
            state.emailsSalvos = novaLista;
            selecionados.delete(email);
            renderEmailsSalvos_(novaLista);
          })
          .catch(function (erro) {
            mostrarStatusEtiquetas_('Erro ao remover e-mail: ' + (erro && erro.message ? erro.message : erro), true);
          });
      });
    });
  }

  function salvarEmailAtual_() {
    var email = document.getElementById('etiquetas-destinatario').value.trim();
    if (!email) {
      mostrarStatusEtiquetas_('Digite um e-mail antes de salvar.', true);
      return;
    }
    runServer('apiSalvarEmail', email)
      .then(function (lista) {
        state.emailsSalvos = lista;
        renderEmailsSalvos_(lista);
        mostrarStatusEtiquetas_('E-mail salvo.', false);
      })
      .catch(function (erro) {
        mostrarStatusEtiquetas_('Erro ao salvar e-mail: ' + (erro && erro.message ? erro.message : erro), true);
      });
  }

  // ---------- Envio do relatório ----------

  function enviarRelatorioEtiquetas_() {
    var dados = state.etiquetas;
    if (!dados) return;

    var destinatarioDigitado = document.getElementById('etiquetas-destinatario').value.trim();
    var destinatarios = [];
    if (destinatarioDigitado) destinatarios.push(destinatarioDigitado);
    (state.emailsSalvosSelecionados || new Set()).forEach(function (email) {
      if (destinatarios.indexOf(email) === -1) destinatarios.push(email);
    });

    var itens = dados.semEtiqueta.filter(function (i) { return selecaoEmailEtiquetas.has(i.produto); });

    if (destinatarios.length === 0) {
      mostrarStatusEtiquetas_('Digite ou marque ao menos um e-mail de destinatário.', true);
      return;
    }
    if (itens.length === 0) {
      mostrarStatusEtiquetas_('Selecione ao menos um produto para enviar.', true);
      return;
    }

    var periodoSelect = document.getElementById('filtro-periodo');
    var rotuloPeriodo = periodoSelect.options[periodoSelect.selectedIndex].textContent;

    var botao = document.getElementById('btn-enviar-etiquetas');
    botao.disabled = true;
    mostrarStatusEtiquetas_('Enviando...', false);

    runServer('apiEnviarRelatorioEtiquetas', destinatarios, rotuloPeriodo, itens)
      .then(function () {
        mostrarStatusEtiquetas_('✅ Relatório enviado para ' + destinatarios.join(', ') + ' (' + itens.length + ' produto(s)).', false);
        selecaoEmailEtiquetas.clear();
        state.emailsSalvosSelecionados = new Set();
        aplicarFiltroEtiqueta_();
        renderEmailsSalvos_(state.emailsSalvos || []);
      })
      .catch(function (erro) {
        mostrarStatusEtiquetas_('Erro ao enviar: ' + (erro && erro.message ? erro.message : erro), true);
      })
      .finally(function () {
        botao.disabled = false;
      });
  }

  // ---------- Eventos ----------

  var NOMES_MESES_EVENTOS = [
    'Janeiro', 'Fevereiro', 'Março', 'Abril', 'Maio', 'Junho',
    'Julho', 'Agosto', 'Setembro', 'Outubro', 'Novembro', 'Dezembro',
  ];
  var NOMES_DIAS_SEMANA_EVENTOS = ['D', 'S', 'T', 'Q', 'Q', 'S', 'S'];

  var eventosCalendarioAno;
  var eventosCalendarioMes; // 1-12

  function carregarEventos() {
    if (eventosCalendarioAno === undefined) {
      var agora = new Date();
      eventosCalendarioAno = agora.getFullYear();
      eventosCalendarioMes = agora.getMonth() + 1;
    }
    runServer('apiObterEventos')
      .then(function (lista) {
        state.eventos = lista;
        renderCalendarioEventos_();
        aplicarFiltroEventos_();
      })
      .catch(mostrarErro_);
  }

  // Tipo filtra normal (mostra só o tipo escolhido). Mês só restringe os
  // Personalizados àquele mês — Simples aparece sempre, já que repete
  // todo mês (inclusive o escolhido).
  function aplicarFiltroEventos_() {
    if (!state.eventos) return;
    var filtroTipo = document.getElementById('filtro-eventotipo').value;
    var filtroMes = document.getElementById('filtro-eventomes').value;

    var filtrados = state.eventos.filter(function (e) {
      if (filtroTipo && e.tipo !== filtroTipo) return false;
      if (filtroMes && e.tipo === 'Personalizado' && Number(e.mes) !== Number(filtroMes)) return false;
      return true;
    });

    renderTabelaEventos_(filtrados);
  }

  function mudarMesEventos_(delta) {
    eventosCalendarioMes += delta;
    if (eventosCalendarioMes > 12) {
      eventosCalendarioMes = 1;
      eventosCalendarioAno += 1;
    } else if (eventosCalendarioMes < 1) {
      eventosCalendarioMes = 12;
      eventosCalendarioAno -= 1;
    }
    renderCalendarioEventos_();
  }

  function eventosDoDiaNoMesAtual_(dia) {
    return (state.eventos || []).filter(function (evento) {
      var caiNesteDia = Number(evento.dia) === dia;
      var caiNesteMes = evento.tipo === 'Simples' || Number(evento.mes) === eventosCalendarioMes;
      return caiNesteDia && caiNesteMes;
    });
  }

  function renderCalendarioEventos_() {
    document.getElementById('eventos-mes-atual').textContent =
      NOMES_MESES_EVENTOS[eventosCalendarioMes - 1] + ' de ' + eventosCalendarioAno;

    var primeiroDiaSemana = new Date(eventosCalendarioAno, eventosCalendarioMes - 1, 1).getDay();
    var totalDias = new Date(eventosCalendarioAno, eventosCalendarioMes, 0).getDate();

    var html = NOMES_DIAS_SEMANA_EVENTOS.map(function (d) {
      return '<div class="dia-semana-label">' + d + '</div>';
    }).join('');

    for (var vazio = 0; vazio < primeiroDiaSemana; vazio++) {
      html += '<div class="dia-celula vazia"></div>';
    }

    var MAX_BOLINHAS_POR_DIA = 2;

    for (var dia = 1; dia <= totalDias; dia++) {
      var eventosDoDia = eventosDoDiaNoMesAtual_(dia);
      var bolinhas = eventosDoDia
        .slice(0, MAX_BOLINHAS_POR_DIA)
        .map(function (e) {
          var icone = e.emoji || (e.tipo === 'Simples' ? '📌' : '🎉');
          return '<span class="evento-bolinha" title="' + escapeAttr_(e.titulo) + '">' + icone + ' ' + fmt_(e.titulo) + '</span>';
        })
        .join('');
      var restantes = eventosDoDia.length - MAX_BOLINHAS_POR_DIA;
      if (restantes > 0) {
        var titulosRestantes = eventosDoDia
          .slice(MAX_BOLINHAS_POR_DIA)
          .map(function (e) { return e.titulo; })
          .join(', ');
        bolinhas += '<span class="evento-mais" title="' + escapeAttr_(titulosRestantes) + '">+' + restantes + ' mais</span>';
      }
      html +=
        '<div class="dia-celula" data-dia="' + dia + '">' +
        '<div class="dia-numero">' + dia + '</div>' +
        '<div class="dia-eventos">' + bolinhas + '</div>' +
        '</div>';
    }

    var el = document.getElementById('calendario-grid');
    el.innerHTML = html;

    el.querySelectorAll('.dia-celula:not(.vazia)').forEach(function (celula) {
      celula.addEventListener('click', function () {
        abrirModalEvento_(Number(celula.dataset.dia));
      });
    });
  }

  // Duas seções: Personalizados em ordem de calendário (mês, depois dia),
  // Simples em ordem de dia do mês — não faz sentido misturar as duas
  // (Simples não tem mês).
  function renderTabelaEventos_(lista) {
    var el = document.getElementById('tabela-eventos');
    if (!lista.length) {
      el.innerHTML = '<tr><td class="empty-state">Nenhum evento cadastrado.</td></tr>';
      return;
    }

    var personalizados = lista
      .filter(function (e) { return e.tipo === 'Personalizado'; })
      .sort(function (a, b) { return Number(a.mes) - Number(b.mes) || Number(a.dia) - Number(b.dia); });
    var simples = lista
      .filter(function (e) { return e.tipo === 'Simples'; })
      .sort(function (a, b) { return Number(a.dia) - Number(b.dia); });

    var html = '<thead><tr><th>Título</th><th>Tipo</th><th>Quando</th><th></th></tr></thead><tbody>';

    function linhaGrupo_(rotulo) {
      return '<tr><td colspan="4" class="linha-grupo-eventos">' + rotulo + '</td></tr>';
    }
    function linhaEvento_(e) {
      var quando = e.tipo === 'Simples' ? 'Todo dia ' + e.dia : e.dia + '/' + e.mes;
      return (
        '<tr><td>' + (e.emoji ? e.emoji + ' ' : '') + fmt_(e.titulo) + '</td>' +
        '<td>' + e.tipo + '</td>' +
        '<td>' + quando + '</td>' +
        '<td><button type="button" class="btn-remover-email" data-id="' + escapeAttr_(e.id) + '" title="Remover">✕</button></td></tr>'
      );
    }

    if (personalizados.length) {
      html += linhaGrupo_('Personalizados');
      personalizados.forEach(function (e) { html += linhaEvento_(e); });
    }
    if (simples.length) {
      html += linhaGrupo_('Simples');
      simples.forEach(function (e) { html += linhaEvento_(e); });
    }

    html += '</tbody>';
    el.innerHTML = html;

    el.querySelectorAll('.btn-remover-email').forEach(function (btn) {
      btn.addEventListener('click', function () {
        runServer('apiRemoverEvento', btn.dataset.id)
          .then(function (novaLista) {
            state.eventos = novaLista;
            renderCalendarioEventos_();
            aplicarFiltroEventos_();
          })
          .catch(mostrarErro_);
      });
    });
  }

  function abrirModalEvento_(dia) {
    state.eventoDiaSelecionado = dia;
    document.getElementById('modal-evento-titulo').textContent =
      'Novo evento — ' + dia + ' de ' + NOMES_MESES_EVENTOS[eventosCalendarioMes - 1];

    renderEventosDoDiaNoModal_(eventosDoDiaNoMesAtual_(dia));

    document.getElementById('form-evento-titulo').value = '';
    document.getElementById('form-evento-tipo').value = 'Personalizado';
    document.getElementById('form-evento-emoji').value = '';
    document.getElementById('form-evento-mensagem').value = '';
    alternarCamposFormularioEvento_();
    document.getElementById('eventos-status').style.display = 'none';

    document.getElementById('modal-evento-backdrop').style.display = 'flex';
  }

  function fecharModalEvento_() {
    document.getElementById('modal-evento-backdrop').style.display = 'none';
  }

  function renderEventosDoDiaNoModal_(eventosDoDia) {
    var el = document.getElementById('modal-eventos-do-dia');
    if (!eventosDoDia.length) {
      el.innerHTML = '';
      return;
    }
    el.innerHTML =
      '<div class="modal-label">Já cadastrados neste dia:</div>' +
      eventosDoDia
        .map(function (e) {
          return (
            '<div class="modal-evento-existente">' +
            '<span>' + (e.emoji ? e.emoji + ' ' : '') + fmt_(e.titulo) + ' (' + e.tipo + ')</span>' +
            '<button type="button" class="btn-remover-email" data-id="' + escapeAttr_(e.id) + '" title="Remover">✕</button>' +
            '</div>'
          );
        })
        .join('');

    el.querySelectorAll('.btn-remover-email').forEach(function (btn) {
      btn.addEventListener('click', function () {
        runServer('apiRemoverEvento', btn.dataset.id)
          .then(function (novaLista) {
            state.eventos = novaLista;
            renderCalendarioEventos_();
            aplicarFiltroEventos_();
            abrirModalEvento_(state.eventoDiaSelecionado);
          })
          .catch(mostrarErroEvento_);
      });
    });
  }

  function alternarCamposFormularioEvento_() {
    var tipo = document.getElementById('form-evento-tipo').value;
    document.getElementById('form-evento-campo-emoji').style.display = tipo === 'Personalizado' ? 'block' : 'none';
    document.getElementById('form-evento-campo-mensagem').style.display = tipo === 'Simples' ? 'block' : 'none';
  }

  function mostrarErroEvento_(erro) {
    var el = document.getElementById('eventos-status');
    el.style.display = 'block';
    el.style.color = '#fca5a5';
    el.textContent = 'Erro: ' + (erro && erro.message ? erro.message : erro);
  }

  function salvarEvento_() {
    var titulo = document.getElementById('form-evento-titulo').value.trim();
    var tipo = document.getElementById('form-evento-tipo').value;

    if (!titulo) {
      mostrarErroEvento_({ message: 'Digite um título.' });
      return;
    }

    var dados = {
      titulo: titulo,
      tipo: tipo,
      dia: state.eventoDiaSelecionado,
      mes: eventosCalendarioMes,
      emoji: document.getElementById('form-evento-emoji').value.trim(),
      mensagem: document.getElementById('form-evento-mensagem').value.trim(),
    };

    if (tipo === 'Simples' && !dados.mensagem) {
      mostrarErroEvento_({ message: 'Digite a mensagem do lembrete.' });
      return;
    }

    var botao = document.getElementById('btn-salvar-evento');
    botao.disabled = true;

    runServer('apiCriarEvento', dados)
      .then(function (lista) {
        state.eventos = lista;
        renderCalendarioEventos_();
        aplicarFiltroEventos_();
        fecharModalEvento_();
      })
      .catch(mostrarErroEvento_)
      .finally(function () {
        botao.disabled = false;
      });
  }

  // ---------- Detalhamento ----------
  // Aba 100% sob demanda — nada é carregado até o usuário buscar, então
  // carregarDetalhamento_ (chamada por SECOES.detalhamento.carregar) não
  // precisa fazer nada; a tela já nasce no estado "busque algo" (Index.html).

  function carregarDetalhamento_() {}

  function buscarDetalhamento_() {
    var termo = document.getElementById('detalhamento-busca').value.trim();
    if (!termo) return;

    var botao = document.getElementById('btn-buscar-detalhamento');
    botao.disabled = true;

    runServer('apiBuscarDetalhamento', termo)
      .then(renderResultadosDetalhamento_)
      .catch(mostrarErro_)
      .finally(function () {
        botao.disabled = false;
      });
  }

  function renderResultadosDetalhamento_(resultados) {
    document.getElementById('detalhamento-painel').style.display = 'none';

    var wrap = document.getElementById('detalhamento-resultados-wrap');
    var vazio = document.getElementById('detalhamento-vazio');
    var el = document.getElementById('tabela-detalhamento-resultados');

    if (!resultados.length) {
      wrap.style.display = 'none';
      vazio.style.display = 'block';
      vazio.textContent = 'Nenhum produto/kit encontrado para esse termo.';
      return;
    }

    vazio.style.display = 'none';
    wrap.style.display = 'block';

    var html = '<thead><tr><th>Produto/Kit</th><th>Tipo</th><th>Total Vendido (histórico)</th></tr></thead><tbody>';
    resultados.forEach(function (r, indice) {
      html +=
        '<tr class="linha-clicavel" data-indice="' + indice + '">' +
        '<td>' + fmt_(r.rotulo) + '</td><td>' + r.tipo + '</td><td>' + fmt_(r.totalVendido) + '</td>' +
        '</tr>';
    });
    html += '</tbody>';
    el.innerHTML = html;

    el.querySelectorAll('.linha-clicavel').forEach(function (tr) {
      tr.addEventListener('click', function () {
        state.detalhamentoChaveAtual = resultados[Number(tr.dataset.indice)].chave;
        carregarDetalhamentoUnidade_();
      });
    });
  }

  function carregarDetalhamentoUnidade_() {
    if (!state.detalhamentoChaveAtual) return;
    var meses = document.getElementById('detalhamento-filtro-meses').value;
    runServer('apiObterDetalhamento', state.detalhamentoChaveAtual, Number(meses))
      .then(renderDetalhamentoPainel_)
      .catch(mostrarErro_);
  }

  function renderDetalhamentoPainel_(dados) {
    document.getElementById('detalhamento-painel').style.display = 'block';
    document.getElementById('detalhamento-titulo-produto').textContent = dados.rotulo + ' (' + dados.tipo + ')';

    var kpis = [
      { label: 'Total Histórico', value: dados.totalHistorico, accent: 'var(--blue)' },
      { label: 'Vendido Mês Passado', value: dados.vendidoMesPassado, accent: 'var(--green)' },
      { label: 'Vendido Este Mês', value: dados.vendidoMesAtual, accent: 'var(--orange)' },
    ];
    document.getElementById('detalhamento-kpis').innerHTML = kpis
      .map(function (c) {
        return (
          '<div class="kpi-card" style="--accent:' + c.accent + '"><div class="label">' + c.label +
          '</div><div class="value">' + fmt_(c.value) + '</div></div>'
        );
      })
      .join('');

    renderChartDetalhamentoMensal_(dados.graficoMensal);

    var blocoKits = document.getElementById('detalhamento-bloco-kits-relacionados');
    if (dados.kitsRelacionados.length) {
      blocoKits.style.display = 'block';
      renderArrayTable(
        'tabela-detalhamento-kits',
        ['Kit', 'Total Vendido'],
        dados.kitsRelacionados.map(function (k) { return [k.rotulo, k.totalVendido]; })
      );
    } else {
      blocoKits.style.display = 'none';
    }

    var blocoComponentes = document.getElementById('detalhamento-bloco-componentes');
    if (dados.componentesDoKit.length) {
      blocoComponentes.style.display = 'block';
      renderArrayTable(
        'tabela-detalhamento-componentes',
        ['Produto', 'Vendido Individualmente (histórico)'],
        dados.componentesDoKit.map(function (c) { return [c.produto, c.vendidoIndividualHistorico]; })
      );
    } else {
      blocoComponentes.style.display = 'none';
    }

    renderArrayTable(
      'tabela-detalhamento-marketplace',
      ['Marketplace', 'Total Vendido', 'Títulos Encontrados'],
      dados.marketplace.map(function (m) {
        return [m.loja, m.total, m.titulos.length ? m.titulos.join('<br>') : '—'];
      })
    );

    renderArrayTable(
      'tabela-detalhamento-categoria',
      ['Produto', 'Gênero', 'Coleção', 'Família Olfativa', 'Categoria', 'Volumetria'],
      dados.categoria.map(function (c) {
        return [c.produto, fmt_(c.genero), fmt_(c.colecao), fmt_(c.familiaOlfativa), fmt_(c.categoria), fmt_(c.volumetria)];
      })
    );

    var producaoTexto = document.getElementById('detalhamento-producao-texto');
    if (dados.producao.noTop15) {
      producaoTexto.textContent =
        'Está no Top 15 do mês passado. Estoque atual: ' + fmt_(dados.producao.estoqueAtual) +
        ' · Código da caixa: ' + (dados.producao.codigo || '—') +
        ' · Meta do mês: ' + fmt_(dados.producao.meta) +
        ' · Sugestão de produção: ' + fmt_(dados.producao.sugestaoProducao) + '.';
    } else {
      producaoTexto.textContent =
        'Não está entre os 15 mais vendidos do mês passado. Estoque atual: ' + fmt_(dados.producao.estoqueAtual) +
        ' · Código da caixa: ' + (dados.producao.codigo || '—') + '.';
    }

    renderArrayTable(
      'tabela-detalhamento-etiquetas',
      ['Produto', 'Etiqueta Disponível'],
      dados.etiquetas.map(function (e) { return [e.produto, e.temEtiqueta ? '✅ Sim' : '🚫 Não']; })
    );

    renderAlertasDetalhamento_(dados.alertas);
  }

  function renderChartDetalhamentoMensal_(graficoMensal) {
    var data = new google.visualization.DataTable();
    data.addColumn('string', 'Mês');
    data.addColumn('number', 'Quantidade');
    data.addRows(
      graficoMensal.length ? graficoMensal.map(function (m) { return [m.rotulo, m.quantidade]; }) : [['Sem dados', 0]]
    );
    var chart = new google.visualization.ColumnChart(document.getElementById('chart-detalhamento-mensal'));
    chart.draw(data, chartOptionsBase_({ colors: ['#3b82f6'], legend: { position: 'none' } }));
  }

  function renderAlertasDetalhamento_(alertas) {
    var el = document.getElementById('detalhamento-alertas');
    if (!alertas.length) {
      el.innerHTML = '<div class="empty-state">Nenhum alerta ativo pra esse item.</div>';
      return;
    }
    var classePorTipo = {
      'Estoque acabando': 'tipo-estoque',
      'Acima da média': 'tipo-crescimento',
      'Queda de vendas': 'tipo-queda',
      'Kit crescendo rapidamente': 'tipo-kit',
    };
    el.innerHTML = alertas
      .map(function (a) {
        var classe = classePorTipo[a.tipo] || '';
        return '<div class="alert-item ' + classe + '"><span class="tipo-tag">' + a.tipo + '</span><span>' + a.mensagem + '</span></div>';
      })
      .join('');
  }

  // ---------- inicialização ----------

  function iniciar_() {
    document.querySelectorAll('.nav-item').forEach(function (el) {
      el.addEventListener('click', function () { ativarSecao_(el.dataset.section); });
    });
    document.getElementById('hamburger-btn').addEventListener('click', function () { alternarSidebar_(); });
    document.getElementById('sidebar-backdrop').addEventListener('click', function () { alternarSidebar_(true); });
    document.getElementById('filtro-periodo').addEventListener('change', function () {
      carregado[secaoAtual] = false;
      ativarSecao_(secaoAtual);
    });
    document.getElementById('filtro-marketplace').addEventListener('change', aplicarFiltroMarketplace_);
    document.getElementById('filtro-categoria').addEventListener('change', aplicarFiltroCategoria_);
    document.getElementById('filtro-tipovenda').addEventListener('change', aplicarFiltroTipoVenda_);
    document.getElementById('filtro-etiqueta').addEventListener('change', aplicarFiltroEtiqueta_);
    document.getElementById('busca-etiquetas').addEventListener('input', aplicarFiltroEtiqueta_);
    document.getElementById('filtro-eventotipo').addEventListener('change', aplicarFiltroEventos_);
    document.getElementById('filtro-eventomes').addEventListener('change', aplicarFiltroEventos_);
    document.getElementById('etiquetas-marcar-todos').addEventListener('change', alternarMarcarTodosEtiquetas_);
    document.getElementById('btn-enviar-etiquetas').addEventListener('click', enviarRelatorioEtiquetas_);
    document.getElementById('btn-gerar-etiquetas-producao').addEventListener('click', gerarEtiquetasProducao_);
    document.getElementById('btn-salvar-email-producao').addEventListener('click', salvarEmailAtualProducao_);
    document.getElementById('btn-solicitar-producao').addEventListener('click', solicitarProducaoPorEmail_);
    document.getElementById('btn-fechar-marketplace').addEventListener('click', fecharModalMarketplace_);
    document.getElementById('modal-marketplace-backdrop').addEventListener('click', function (evento) {
      if (evento.target.id === 'modal-marketplace-backdrop') fecharModalMarketplace_();
    });
    document.getElementById('btn-cancelar-selecao-etiquetas').addEventListener('click', fecharModalSelecaoEtiquetas_);
    document.getElementById('btn-confirmar-selecao-etiquetas').addEventListener('click', confirmarSelecaoEtiquetas_);
    document.getElementById('modal-etiquetas-selecao-backdrop').addEventListener('click', function (evento) {
      if (evento.target.id === 'modal-etiquetas-selecao-backdrop') fecharModalSelecaoEtiquetas_();
    });
    document.getElementById('btn-buscar-detalhamento').addEventListener('click', buscarDetalhamento_);
    document.getElementById('detalhamento-busca').addEventListener('keydown', function (evento) {
      if (evento.key === 'Enter') buscarDetalhamento_();
    });
    document.getElementById('detalhamento-filtro-meses').addEventListener('change', carregarDetalhamentoUnidade_);
    document.getElementById('btn-salvar-email').addEventListener('click', salvarEmailAtual_);
    document.getElementById('btn-mes-anterior').addEventListener('click', function () { mudarMesEventos_(-1); });
    document.getElementById('btn-mes-proximo').addEventListener('click', function () { mudarMesEventos_(1); });
    document.getElementById('form-evento-tipo').addEventListener('change', alternarCamposFormularioEvento_);
    document.getElementById('btn-cancelar-evento').addEventListener('click', fecharModalEvento_);
    document.getElementById('modal-evento-backdrop').addEventListener('click', function (evento) {
      if (evento.target.id === 'modal-evento-backdrop') fecharModalEvento_();
    });
    document.getElementById('btn-salvar-evento').addEventListener('click', salvarEvento_);
    ['tabela-etiquetas-com', 'tabela-etiquetas-sem', 'tabela-etiquetas-semcorrespondencia'].forEach(function (id) {
      document.getElementById(id).addEventListener('click', function (evento) {
        var th = evento.target.closest('.th-ordenavel');
        if (!th) return;
        ordenarClique_(th.dataset.tabela, th.dataset.coluna);
      });
    });
    document.getElementById('btn-atualizar').addEventListener('click', function () {
      carregado[secaoAtual] = false;
      ativarSecao_(secaoAtual);
    });

    ativarSecao_('dashboard');
  }

  google.charts.load('current', { packages: ['corechart', 'calendar', 'gauge'] });
  google.charts.setOnLoadCallback(iniciar_);
</script>
