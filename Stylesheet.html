<style>
  :root {
    --bg: #0b1220;
    --bg-elevated: #111a2e;
    --surface: #17233d;
    --surface-hover: #1d2c4d;
    --border: #263353;
    --text: #e6ecff;
    --text-dim: #93a2c7;
    --blue: #3b82f6;
    --blue-dim: #1d4ed8;
    --green: #22c55e;
    --green-dim: #15803d;
    --orange: #f97316;
    --orange-dim: #c2410c;
    --red: #ef4444;
    --red-bg: #451a1a;
    --orange-bg: #4a2a12;
    --gray-bg: #2a3352;
    --yellow-bg: #4a3c12;
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Google Sans', Roboto, Arial, sans-serif;
    font-size: 14px;
  }

  #app { display: flex; min-height: 100vh; }

  /* Sidebar */
  #sidebar {
    width: 220px;
    flex-shrink: 0;
    background: var(--bg-elevated);
    border-right: 1px solid var(--border);
    padding: 16px 0;
    display: flex;
    flex-direction: column;
  }

  #sidebar .brand {
    padding: 0 20px 16px 20px;
    font-weight: 700;
    font-size: 15px;
    color: var(--text);
    border-bottom: 1px solid var(--border);
    margin-bottom: 8px;
  }
  #sidebar .brand small { display: block; color: var(--text-dim); font-weight: 400; font-size: 11px; margin-top: 2px; }

  .nav-item {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 20px;
    color: var(--text-dim);
    cursor: pointer;
    border-left: 3px solid transparent;
    font-size: 13px;
    user-select: none;
  }
  .nav-item .icon { font-size: 15px; width: 18px; text-align: center; }
  .nav-item:hover { background: var(--surface-hover); color: var(--text); }
  .nav-item.active { background: var(--surface); color: var(--text); border-left-color: var(--blue); font-weight: 600; }

  /* Main area */
  #main { flex: 1; min-width: 0; display: flex; flex-direction: column; }

  #topbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 14px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--bg-elevated);
  }
  #topbar h1 { font-size: 16px; margin: 0; font-weight: 600; }
  #topbar .filters { display: flex; gap: 10px; align-items: center; }

  select, button.btn {
    background: var(--surface);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 10px;
    font-size: 12px;
    cursor: pointer;
  }
  select:hover, button.btn:hover { background: var(--surface-hover); }
  button.btn.primary { background: var(--blue-dim); border-color: var(--blue); }
  button.btn.primary:hover { background: var(--blue); }

  #content { padding: 20px 24px 60px 24px; overflow-y: auto; }
  .section { display: none; }
  .section.active { display: block; }

  h2.section-title { font-size: 15px; margin: 0 0 14px 0; color: var(--text); }
  h3.subsection-title { font-size: 13px; margin: 22px 0 10px 0; color: var(--text-dim); text-transform: uppercase; letter-spacing: .04em; }

  /* KPI cards */
  .kpi-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; margin-bottom: 20px; }
  @media (max-width: 900px) { .kpi-grid { grid-template-columns: repeat(2, 1fr); } }

  .kpi-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    border-top: 3px solid var(--accent, var(--blue));
  }
  .kpi-card .label { font-size: 11px; color: var(--text-dim); margin-bottom: 6px; }
  .kpi-card .value { font-size: 22px; font-weight: 700; }

  .chart-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 8px; }
  @media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }
  .chart-box {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 12px;
  }
  .chart-box .chart-title { font-size: 12px; color: var(--text-dim); margin-bottom: 6px; }
  .chart-box .chart-el { width: 100%; height: 260px; }
  .chart-box .chart-el.tall { height: 340px; }

  /* Tables */
  table.data-table { width: 100%; border-collapse: collapse; margin-bottom: 4px; }
  table.data-table th, table.data-table td {
    text-align: left;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border);
    font-size: 12.5px;
  }
  table.data-table th { color: var(--text-dim); font-weight: 600; font-size: 11px; text-transform: uppercase; letter-spacing: .03em; }
  table.data-table tbody tr:hover { background: var(--surface-hover); }
  .table-wrap { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 4px 12px; margin-bottom: 18px; overflow-x: auto; }

  /* Badges */
  .badge { display: inline-block; padding: 2px 9px; border-radius: 999px; font-size: 11px; font-weight: 600; }
  .badge-red { background: var(--red-bg); color: #fca5a5; }
  .badge-orange { background: var(--orange-bg); color: #fdba74; }
  .badge-gray { background: var(--gray-bg); color: #cbd5e1; }
  .badge-yellow { background: var(--yellow-bg); color: #fde68a; }
  .badge-green { background: #123a24; color: #86efac; }
  .badge-blue { background: #14264a; color: #93c5fd; }

  .empty-state { color: var(--text-dim); padding: 30px; text-align: center; font-size: 13px; }
  .loading { color: var(--text-dim); padding: 20px; font-size: 13px; }

  .alert-list { display: flex; flex-direction: column; gap: 8px; }
  .alert-item {
    background: var(--surface);
    border: 1px solid var(--border);
    border-left: 3px solid var(--blue);
    border-radius: 8px;
    padding: 10px 14px;
    display: flex;
    gap: 10px;
    align-items: baseline;
    font-size: 13px;
  }
  .alert-item.tipo-estoque { border-left-color: var(--red); }
  .alert-item.tipo-queda { border-left-color: var(--red); }
  .alert-item.tipo-crescimento { border-left-color: var(--green); }
  .alert-item.tipo-etiqueta { border-left-color: var(--orange); }
  .alert-item.tipo-kit { border-left-color: var(--blue); }
  .alert-item .tipo-tag { font-size: 10px; text-transform: uppercase; color: var(--text-dim); min-width: 130px; }

  .checklist { columns: 2; column-gap: 24px; }
  @media (max-width: 700px) { .checklist { columns: 1; } }
  .checklist-group { break-inside: avoid; margin-bottom: 14px; }
  .checklist-group .titulo { font-weight: 700; font-size: 12.5px; margin-bottom: 4px; }
  .checklist-group .item { font-size: 12.5px; color: var(--text-dim); padding: 1px 0; }

  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-thumb { background: var(--border); border-radius: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
</style>
